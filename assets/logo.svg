<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 56" width="228" height="56" role="img" aria-label="DocLocker Logo">
  <defs>
    <linearGradient id="mvDocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E66FF"/>
      <stop offset="100%" stop-color="#0645D9"/>
    </linearGradient>
    <linearGradient id="mvSwooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0645D9"/>
      <stop offset="100%" stop-color="#2D7BFF"/>
    </linearGradient>
  </defs>

  <!-- Blue Document Icon -->
  <g transform="translate(4, 4)">
    <!-- Document body with folded corner -->
    <path d="M10 3 H29 L39 13 V42 C39 44.76 36.76 47 34 47 H10 C7.24 47 5 44.76 5 42 V8 C5 5.24 7.24 3 10 3 Z" fill="url(#mvDocGrad)"/>
    <!-- Folded top-right corner -->
    <path d="M29 3 V11 C29 12.1 29.9 13 31 13 H39 L29 3 Z" fill="#93C5FD"/>
    <!-- White document text lines -->
    <rect x="11" y="12" width="13" height="2.8" rx="1.4" fill="#FFFFFF" opacity="0.95"/>
    <rect x="11" y="18" width="17" height="2.8" rx="1.4" fill="#FFFFFF" opacity="0.85"/>
    <rect x="11" y="24" width="10" height="2.8" rx="1.4" fill="#FFFFFF" opacity="0.75"/>

    <!-- Subtle circular blue swoosh around cloud -->
    <path d="M2 27 C4 19, 13 15, 22 17" fill="none" stroke="url(#mvSwooshGrad)" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
    <path d="M44 26 C44 37, 34 45, 22 45" fill="none" stroke="url(#mvSwooshGrad)" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>

    <!-- White Cloud overlapping bottom-right -->
    <path d="M15 43 H39 C43.4 43 47 39.6 47 35.3 C47 31.4 44.1 28.2 40.3 27.6 C39.3 22.8 35.1 19.3 30 19.3 C24.6 19.3 20.1 23.2 19.4 28.4 C15.8 29 13 32.1 13 35.8 C13 39.8 14 43 15 43 Z" fill="#FFFFFF" stroke="#DCE8FF" stroke-width="1.2"/>

    <!-- Dark Navy Security Lock Symbol -->
    <g transform="translate(23.5, 24.5)">
      <path d="M3.5 6.5 V4.5 C3.5 2.57 5.07 1 7 1 C8.93 1 10.5 2.57 10.5 4.5 V6.5" fill="none" stroke="#0A1E4E" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="1.5" y="6.2" width="11" height="9.2" rx="2.2" fill="#0A1E4E"/>
      <circle cx="7" cy="10.2" r="1.3" fill="#FFFFFF"/>
      <rect x="6.35" y="10.8" width="1.3" height="2.6" rx="0.65" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Brand Wordmark: 'Doc' in dark navy, 'Locker' in royal blue -->
  <text x="60" y="36" font-family="Manrope, DM Sans, -apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.6">
    <tspan fill="#0A1E4E">Doc</tspan><tspan fill="#0645D9">Locker</tspan>
  </text>
</svg>
