<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" role="img" aria-label="Secure Digital Document Shield Illustration">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.24"/>
      <stop offset="65%" stop-color="#93C5FD" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#EBF2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#0645D9"/>
      <stop offset="100%" stop-color="#0535A8"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0645D9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0645D9" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Soft radial glow -->
  <circle cx="260" cy="220" r="200" fill="url(#heroGlow)"/>

  <!-- Orbital rings matching reference illustration -->
  <ellipse cx="260" cy="226" rx="195" ry="125" transform="rotate(-14 260 226)" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7"/>
  <ellipse cx="260" cy="226" rx="165" ry="150" transform="rotate(18 260 226)" fill="none" stroke="#60A5FA" stroke-width="1.4" opacity="0.45"/>

  <!-- Subtle accent nodes -->
  <circle cx="90" cy="145" r="5" fill="#0645D9" opacity="0.65"/>
  <circle cx="430" cy="160" r="4" fill="#3B82F6" opacity="0.55"/>
  <circle cx="115" cy="310" r="3.5" fill="#60A5FA" opacity="0.75"/>
  <circle cx="405" cy="300" r="5.5" fill="#0645D9" opacity="0.4"/>

  <!-- Background translucent document cards behind shield -->
  <g transform="translate(115, 118) rotate(-12)" opacity="0.45">
    <rect width="88" height="112" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="14" y="20" width="38" height="6" rx="3" fill="#93C5FD"/>
    <rect x="14" y="34" width="58" height="5" rx="2.5" fill="#DBEAFE"/>
    <rect x="14" y="46" width="48" height="5" rx="2.5" fill="#DBEAFE"/>
  </g>
  <g transform="translate(325, 128) rotate(11)" opacity="0.45">
    <rect width="88" height="112" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="14" y="20" width="44" height="6" rx="3" fill="#93C5FD"/>
    <rect x="14" y="34" width="56" height="5" rx="2.5" fill="#DBEAFE"/>
    <rect x="14" y="46" width="40" height="5" rx="2.5" fill="#DBEAFE"/>
  </g>

  <!-- Central Security Shield -->
  <g filter="url(#softShadow)">
    <path d="M260 72 L372 114 V212 C372 287 322 346 260 374 C198 346 148 287 148 212 V114 L260 72 Z" fill="url(#shieldOuter)"/>
    <path d="M260 88 L356 124 V210 C356 277 313 330 260 355 C207 330 164 277 164 210 V124 L260 88 Z" fill="url(#shieldInner)" stroke="#93C5FD" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Highlight facet -->
    <path d="M260 88 L356 124 V210 C356 240 347 268 331 292 L260 220 V88 Z" fill="#FFFFFF" opacity="0.08"/>
  </g>

  <!-- White Padlock inside Shield -->
  <g transform="translate(216, 152)">
    <!-- Shackle -->
    <path d="M22 44 V30 C22 17.85 31.85 8 44 8 C56.15 8 66 17.85 66 30 V44" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
    <!-- Lock body -->
    <rect x="8" y="42" width="72" height="58" rx="14" fill="#FFFFFF"/>
    <!-- Keyhole -->
    <circle cx="44" cy="66" r="7.5" fill="#0645D9"/>
    <path d="M40.5 70 L39 84 C39 85.6 40.3 87 42 87 H46 C47.7 87 49 85.6 49 84 L47.5 70 Z" fill="#0645D9"/>
  </g>
</svg>
