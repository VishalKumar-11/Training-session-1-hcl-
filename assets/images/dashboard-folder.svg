<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 130" width="180" height="130" role="img" aria-label="Protected Document Folder Illustration">
  <defs>
    <linearGradient id="folderBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="greenShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="folderShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0A1E4E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Back sheets -->
  <rect x="24" y="20" width="66" height="80" rx="8" transform="rotate(-10 24 20)" fill="#E0ECFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="52" y="12" width="70" height="82" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="64" y="24" width="38" height="4" rx="2" fill="#93C5FD"/>
  <rect x="64" y="34" width="46" height="4" rx="2" fill="#DBEAFE"/>

  <!-- Folder Body -->
  <g filter="url(#folderShadow)">
    <path d="M28 42 C28 37.58 31.58 34 36 34 H64 L74 44 H134 C138.42 44 142 47.58 142 52 V102 C142 106.42 138.42 110 134 110 H36 C31.58 110 28 106.42 28 102 V42 Z" fill="url(#folderBack)"/>
    <path d="M24 54 C24 49.58 27.58 46 32 46 H138 C142.42 46 146 49.58 146 54 L141 102 C140.5 106.5 136.8 110 132.2 110 H37.8 C33.2 110 29.5 106.5 29 102 L24 54 Z" fill="url(#folderFront)"/>
  </g>

  <!-- Verified Green Shield -->
  <g transform="translate(114, 62)" filter="url(#folderShadow)">
    <path d="M24 2 L44 10 V24 C44 37.5 35.4 48.2 24 53 C12.6 48.2 4 37.5 4 24 V10 L24 2 Z" fill="url(#greenShield)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M16 26 L21.5 31.5 L33 20" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
